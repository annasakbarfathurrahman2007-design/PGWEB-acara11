
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Batas Kabupaten Jawa Timur</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
            padding: 12px;
            margin: 0;
            background-color: #2c3e50;
            color: white;
        }

        #map {
            width: 100%;
            height: 90vh;
        }

        /* Tampilan legenda */
        .legend-container {
            background: white;
            padding: 8px;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            min-width: 160px;
        }

        /* Tombol dropdown */
        .legend-title {
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            color: #333;
        }

        /* Isi legenda */
        .legend-content {
            display: none;
            padding: 8px 5px 3px;
            border-top: 1px solid #ddd;
            margin-top: 5px;
        }

        /* Gambar legenda */
        .legend-content img {
            max-width: 100%;
        }

        /* Panah dropdown */
        .arrow {
            transition: transform 0.3s;
        }

        .arrow.active {
            transform: rotate(180deg);
        }

    </style>
</head>

<body>

    <h2>Peta Batas Kabupaten Jawa Timur</h2>

    <div id="map"></div>

    <script>

        // Membuat peta
        var map = L.map("map").setView([-7.7, 112.5], 8);

        // Basemap OpenStreetMap
        var osm = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }
        );

        osm.addTo(map);

        // Menghubungkan layer GeoServer
        var wmsLayer1 = L.tileLayer.wms(
            "http://localhost:8080/geoserver/wms",
            {
                layers: "pgweb:kabupaten_jatim",
                format: "image/png",
                transparent: true,
                version: "1.1.1"
            }
        );

        wmsLayer1.addTo(map);


        // Membuat legenda dropdown
        var layerLegend = L.control({
            position: "bottomright"
        });

        layerLegend.onAdd = function (map) {

            var div = L.DomUtil.create(
                "div",
                "legend-container"
            );

            div.innerHTML = `
                <div class="legend-title" id="legendToggle">
                    <span>Legenda Kabupaten</span>
                    <span class="arrow" id="legendArrow">▼</span>
                </div>

                <div class="legend-content" id="legendContent">
                    <b>Batas Kabupaten Jawa Timur</b>
                    <br>
                    <img src="http://localhost:8080/geoserver/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=pgweb:kabupaten_jatim"
                    alt="Legenda Kabupaten">
                </div>
            `;

            // Mengatur dropdown
            var toggle = div.querySelector("#legendToggle");
            var content = div.querySelector("#legendContent");
            var arrow = div.querySelector("#legendArrow");

            toggle.onclick = function () {

                if (content.style.display === "block") {
                    content.style.display = "none";
                    arrow.classList.remove("active");
                } else {
                    content.style.display = "block";
                    arrow.classList.add("active");
                }

            };

            // Mencegah klik legenda mengganggu peta
            L.DomEvent.disableClickPropagation(div);

            return div;
        };

        layerLegend.addTo(map);


        // Pengaturan basemap
        var baseMaps = {
            "OpenStreetMap": osm
        };

        // Pengaturan overlay
        var overlayMaps = {
            "Batas Kabupaten Jawa Timur": wmsLayer1
        };

        // Kontrol layer
        var layerControl = L.control.layers(
            baseMaps,
            overlayMaps
        ).addTo(map);

    </script>

</body>
</html>
